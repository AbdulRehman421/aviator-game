<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Aviator Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 32px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .amount {
            font-size: 36px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .order-info {
            color: #666;
            font-size: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 16px;
            margin-top: 24px;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
        }

        .payment-method {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .payment-method:hover {
            border-color: #4CAF50;
            background: #f8fff9;
        }

        .payment-method.selected {
            border-color: #4CAF50;
            background: #f8fff9;
        }

        .payment-method input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #4CAF50;
        }

        .payment-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .payment-label {
            flex: 1;
            font-weight: 500;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .phone-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 80px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: #f5f5f5;
            text-align: center;
            font-weight: 500;
        }

        .info-box {
            background: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            font-size: 13px;
            color: #2e7d32;
            line-height: 1.5;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 24px;
        }

        .submit-btn:hover {
            background: #45a049;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="amount" id="amount">PKR 0.00</div>
            <div class="order-info">
                Order Number: <span id="orderId">Loading...</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="paymentForm">
            <div class="section-title">Select Payment Method</div>
            
            <div class="payment-methods">
                <label class="payment-method" data-method="jazzcash">
                    <input type="radio" name="paymentMethod" value="jazzcash" checked>
                    <div class="payment-icon">📱</div>
                    <div class="payment-label">JazzCash</div>
                </label>

                <label class="payment-method" data-method="easypaisa">
                    <input type="radio" name="paymentMethod" value="easypaisa">
                    <div class="payment-icon">💳</div>
                    <div class="payment-label">EasyPaisa</div>
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">Wallet Account / Mobile Number</label>
                <div class="phone-input-wrapper">
                    <div class="country-code">+92</div>
                    <input 
                        type="tel" 
                        class="form-input" 
                        id="phoneNumber" 
                        placeholder="3001234567"
                        pattern="[0-9]{10}"
                        required
                    >
                </div>
            </div>

            <div class="info-box">
                After clicking "Submit", please open your wallet and enter your password to complete the payment.
                <br><br>
                بعد از کلک کرنے کے بعد، براہ کرم اپنا والیٹ کھولیں اور ادائیگی مکمل کرنے کے لیے اپنا پاس ورڈ درج کریں۔
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Submit | جمع کرائیں
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Processing payment...</div>
        </div>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration - REPLACE WITH YOUR CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const depositId = urlParams.get('depositId');
        const userId = urlParams.get('uid');
        const amount = urlParams.get('amount');

        // Display order info
        document.getElementById('amount').textContent = `PKR ${parseFloat(amount).toFixed(2)}`;
        document.getElementById('orderId').textContent = depositId || 'N/A';

        // Payment method selection
        const paymentMethods = document.querySelectorAll('.payment-method');
        paymentMethods.forEach(method => {
            method.addEventListener('click', () => {
                paymentMethods.forEach(m => m.classList.remove('selected'));
                method.classList.add('selected');
                method.querySelector('input[type="radio"]').checked = true;
            });
        });

        // Form submission
        const form = document.getElementById('paymentForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            if (!phoneNumber || phoneNumber.length < 10) {
                showError('Please enter a valid phone number');
                return;
            }

            // Show loading
            form.style.display = 'none';
            loading.classList.add('active');

            try {
                // Update deposit with phone number
                const depositRef = ref(database, `deposits/${depositId}`);
                await update(depositRef, {
                    phoneNumber: phoneNumber,
                    method: paymentMethod,
                    status: 'processing'
                });

                // Redirect to payment gateway
                const paymentUrl = await initiatePayment(depositId, amount, phoneNumber, paymentMethod);
                
                if (paymentUrl) {
                    window.location.href = paymentUrl;
                } else {
                    // For demo, simulate payment
                    setTimeout(async () => {
                        await update(depositRef, {
                            status: 'approved'
                        });
                        showSuccess();
                    }, 2000);
                }
            } catch (error) {
                console.error('Payment error:', error);
                showError('Payment failed. Please try again.');
                form.style.display = 'block';
                loading.classList.remove('active');
            }
        });

        async function initiatePayment(depositId, amount, phoneNumber, method) {
            // Call your backend API to generate payment URL
            // This should call JazzCash/EasyPaisa API
            
            // For now, return null to simulate payment
            return null;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function showSuccess() {
            loading.innerHTML = `
                <div style="color: #4CAF50; font-size: 48px; margin-bottom: 16px;">✓</div>
                <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Payment Successful!</div>
                <div style="color: #666;">Your balance has been credited.</div>
                <div style="margin-top: 16px; color: #666;">Redirecting to game...</div>
            `;
            
            setTimeout(() => {
                window.close();
            }, 3000);
        }
    </script>
</body>
</html>
